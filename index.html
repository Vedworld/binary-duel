<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Duel</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#d6d6d6;
    font:12px/1.4 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;-webkit-user-select:none;user-select:none}
  canvas.layer{position:fixed;inset:0;width:100%;height:100%;display:block}
  #glow{filter:blur(9px);opacity:.45;image-rendering:auto}
  #srcView{position:fixed;right:16px;top:44px;width:260px;height:auto;border:1px solid rgba(255,255,255,.3);background:#000;display:none;z-index:5}
  body.showsrc #srcView{display:block}

  #hud{position:fixed;left:16px;right:16px;top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;pointer-events:none;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);transition:opacity .4s;z-index:4}
  #hud b{color:#fff;font-weight:600}
  #hud .r{margin-left:auto}

  #caption{position:fixed;left:0;right:0;top:64%;text-align:center;pointer-events:none;opacity:0;
    font-size:clamp(10px,1.4vw,15px);letter-spacing:.35em;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.6);z-index:3}

  #move{position:fixed;left:0;right:0;top:11%;text-align:center;pointer-events:none;z-index:3;opacity:0}
  #move b{display:block;font-size:clamp(18px,3.4vw,40px);font-weight:800;letter-spacing:.32em;color:#fff;
    text-shadow:0 0 18px rgba(255,255,255,.75),0 0 2px #fff}
  #move small{display:block;margin:6px auto 0;max-width:92vw;font-size:clamp(8px,.9vw,11px);letter-spacing:.2em;color:rgba(255,255,255,.55);
    white-space:nowrap;overflow:hidden;text-overflow:clip}
  #move.pop{animation:pop 1s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}

  #bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:8px;padding:8px 10px;max-width:calc(100vw - 24px);box-sizing:border-box;
    background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.16);border-radius:10px;transition:opacity .4s;z-index:6}
  body.idle #bar, body.idle #hud{opacity:0}
  body.idle{cursor:none}
  #bar button, #bar .btn{font:inherit;font-size:12px;color:#eee;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
    border-radius:7px;padding:5px 10px;cursor:pointer;line-height:1.2;min-width:32px}
  #bar button:hover, #bar .btn:hover{background:rgba(255,255,255,.14)}
  #bar button.on{background:#fff;color:#000;border-color:#fff}
  #bar label{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.6);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  #bar input[type=range]{width:86px;accent-color:#fff}
  #bar .sep{width:1px;height:20px;background:rgba(255,255,255,.15)}
  @media (max-width:560px){#bar{gap:6px;padding:6px;bottom:14px}#bar .sep{display:none}#bar input[type=range]{width:64px}#bar button,#bar .btn{padding:5px 8px}#hud{font-size:10px}}

  #seek{position:fixed;left:0;right:0;bottom:0;height:12px;cursor:pointer;z-index:6}
  #seek::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.1)}
  #seek i{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff}

  #drop{position:fixed;inset:14px;display:none;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.7);
    border-radius:14px;background:rgba(0,0,0,.6);font-size:16px;letter-spacing:.2em;text-transform:uppercase;z-index:9}
  body.dragging #drop{display:flex}
</style>
</head>
<body>
<canvas id="glow" class="layer"></canvas>
<canvas id="out" class="layer"></canvas>

<div id="hud">
  <span><b>Binary Duel</b></span>
  <span id="hShot">Shot 01</span>
  <span id="hTime">T 00.00</span>
  <span id="hHits">Hits 00</span>
  <span id="hRate"></span>
  <span class="r" id="hGrid"></span>
</div>
<div id="caption"></div>
<div id="move"><b id="moveName"></b><small id="moveBits"></small></div>

<div id="bar">
  <button id="bPlay" title="Play / pause (Space)">❚❚</button>
  <button id="bRestart" title="Restart (R)">⟲</button>
  <span class="sep"></span>
  <label title="Cell size (+ / -)">Cell <input id="rDensity" type="range" min="5" max="22" step="1"></label>
  <label title="Brightness gain">Gain <input id="rGain" type="range" min="0.5" max="2.5" step="0.05" value="1"></label>
  <button id="bPalette" title="Colour (P)">Mono</button>
  <button id="bSource" title="Show the un-digitised 3D source (S)">Source</button>
  <span class="sep"></span>
  <button id="bDuel" class="on" title="Built-in 3D knight duel">Duel</button>
  <label class="btn" title="Turn your own video into binary (L)">Load clip<input id="fVideo" type="file" accept="video/*" hidden></label>
  <button id="bFull" title="Fullscreen (F)">⛶</button>
</div>
<div id="seek"><i></i></div>
<div id="drop">Drop a video to turn it into binary</div>
<video id="vid" muted loop playsinline hidden></video>

<script>
(() => {
"use strict";

/*CORE-START — pure animation logic: no DOM in here */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = d => d - TAU * Math.round(d / TAU);
const EASE = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t),
  in: t => t * t * t,
  out: t => 1 - (1 - t) ** 3,
  snap: t => 1 - (1 - t) ** 5,
  back: t => 1 + 2.7 * (t - 1) ** 3 + 1.7 * (t - 1) ** 2,

/* ---------- vec3 (y is up) ---------- */

const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

const norm3 = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

const rot3 = (v, k, c, s) => add3(add3(mul3(v, c), mul3(cross3(k, v), s)), mul3(k, dot3(k, v) * (1 - c)));

const HB = { sw: 2.3, hand: [14, -8] }, VB = { sw: 2.55, hand: [18, 12] };

// a sword wheel: the blade makes `revs` full turns around the hand
function twirl(t0, dur, revs, pose, x, o) {
  const steps = Math.ceil(revs * 3), base = Object.assign({}, BASE, P[pose], o).sw, keys = [];
  for (let i = 1; i <= steps; i++) keys.push([t0 + dur * i / steps, pose, x, Object.assign({}, o, { sw: base + i * TAU * revs / steps }), i === 1 ? "in" : "lin"]);
  return keys;
}
// a full-body 360: wind, three quarter-turns, then the cut lands facing forward again
function spin(t0, x0, x1, endPose, endO, mid) {
  const q = [1.571, 3.142, 4.712];
  return [
    ...q.map((turn, i) => [t0 + .07 * (i + 1), "spinMid", lerp(x0, x1, (i + 1) / 4), Object.assign({}, mid, { turn }), i ? "lin" : "in"]),
    [t0 + .3, endPose, x1, Object.assign({}, endO, { turn: 6.283 }), "out"],
  ];
}

// [time, pose, worldX, overrides, easing into this key]
const TRACK_A = [
  [0, "idle", -92], [0.45, "twirl", -92], ...twirl(0.45, .9, 2, "twirl", -92), [1.65, "guard", -90],
  [2.0, "step1", -78], [2.4, "step2", -66], [2.75, "guard", -56],
  // OVERHEAD
  [3.0, "windup", -58, null, "out"], [3.18, "windup", -59, { lean: -.26 }], [3.3, "chop", -44, null, "in"], [3.5, "recoil", -50, null, "out"],
  // block the COUNTER, then bind
  [3.75, "guard", -50], [3.93, "vblock", -48, null, "snap"], [3.95, "vblock", -48],
  [4.25, "bind", -30, null, "out"], [4.55, "bind", -33, { lean: .22 }], [4.8, "bind", -31, { lean: .3 }],
  [5.15, "stagger", -60, null, "out"],
  // SPIN SLASH
  [5.4, "spinWind", -62], [5.55, "spinWind", -62, { h: 30 }], ...spin(5.55, -62, -44, "slash"), [6.05, "slashF", -42, null, "out"],
  // DODGE the uppercut, KICK
  [6.3, "guard", -44], [6.45, "dodge", -50, null, "snap"], [6.62, "dodge", -50, { lean: -.45 }],
  [6.72, "kickP", -40], [6.84, "kick", -28, null, "in"], [7.05, "guard", -36, null, "out"],
  // block the SPIN CUT
  [7.5, "guard", -44], [7.92, "vblock", -58, null, "snap"], [7.95, "vblock", -58], [8.15, "vblock", -64, { lean: -.12 }, "out"],
  // AERIAL FLIP
  [8.35, "windup", -66, { h: 30, lean: .2 }], [8.5, "leap", -60, null, "out"],
  [8.62, "tuck", -56, { roll: 2.094 }, "lin"], [8.74, "tuck", -52, { roll: 4.189 }, "lin"],
  [8.86, "leap", -50, { roll: 6.283, air: 24, hand: [4, -22], sw: 4.0 }, "lin"],
  [9.0, "airChop", -48, null, "in"], [9.25, "land", -44, null, "out"], [9.5, "land", -44, { h: 30 }],
  // PARRY the thrust
  [9.65, "side", -56], [9.83, "parry", -60, null, "snap"], [9.85, "parry", -60], [10.05, "guard", -54],
  // fast exchange
  [10.33, "hblock", -50, HB, "snap"], [10.35, "hblock", -50, HB], [10.5, "guard", -52],
  [10.62, "slashB", -50, null, "out"], [10.8, "slash", -44, null, "in"], [10.95, "slashF", -44, null, "out"],
  [11.1, "guard", -48], [11.23, "vblock", -51, VB, "snap"], [11.25, "vblock", -51, VB], [11.4, "guard", -50],
  [11.55, "guard", -52, { hand: [6, 8], sw: 1.7 }, "out"], [11.7, "thrust", -44, null, "in"], [11.85, "guard", -48, null, "out"],
  [12.13, "hblock", -50, HB, "snap"], [12.15, "hblock", -50, HB], [12.3, "hblock", -46, Object.assign({ h: 30 }, HB)],

  [14.45, "point", -61], [END, "point", -61, { lean: .22 }],
];
const TRACK_B = [
  [0, "idle", 92], [0.7, "salute", 92], [1.3, "salute", 92], [1.65, "guard", 90],
  [2.0, "step1", 78], [2.4, "step2", 66], [2.75, "guard", 54],
  [3.1, "guard", 52], [3.28, "hblock", 46, null, "snap"], [3.3, "hblock", 46], [3.5, "hblock", 52, { h: 30 }, "out"],
  [3.72, "slashB", 50, null, "out"], [3.84, "slashB", 51, { lean: -.22 }], [3.95, "slash", 40, null, "in"],
  [4.25, "bind", 32, null, "out"], [4.55, "bind", 35, { lean: .36 }], [4.8, "bind", 30, { lean: .4 }],
  [4.95, "shove", 20, null, "in"], [5.25, "guard", 28],
  [5.5, "guard", 40], [5.82, "vblock", 46, VB, "snap"], [5.85, "vblock", 46, VB], [6.05, "vblock", 54, Object.assign({ lean: -.1 }, VB), "out"],
  [6.25, "lowGuard", 30], [6.45, "rising", 12, null, "in"], [6.62, "rising", 10, { hand: [14, -26], sw: 3.4 }, "out"],
  [6.86, "hit", 14, null, "snap"], [7.2, "hit", 40, { lean: -.35 }, "out"], [7.45, "guard", 44],
  [7.55, "spinWind", 46], [7.65, "spinWind", 46, { h: 30 }], ...spin(7.65, 46, 28, "slash"), [8.15, "slashF", 26, null, "out"],
  [8.4, "guard", 34], [8.9, "guard", 34, { h: 34 }], [8.98, "kneelB", 32, null, "snap"], [9.0, "kneelB", 32], [9.5, "kneelB", 34, { h: 23 }],
  [9.7, "kneelB", 36, { hand: [4, 6], sw: 1.7, h: 24 }], [9.85, "thrust", 28, null, "in"], [10.05, "guard", 40, null, "out"],
  [10.2, "windup", 42, null, "out"], [10.35, "chop", 34, null, "in"], [10.5, "recoil", 40, null, "out"],
  [10.78, "vblock", 45, VB, "snap"], [10.8, "vblock", 45, VB], [10.95, "guard", 46],
  [11.1, "slashB", 44, null, "out"], [11.25, "slash", 38, null, "in"], [11.4, "slashF", 38, null, "out"],
  [11.55, "guard", 46], [11.68, "parry", 45, null, "snap"], [11.7, "parry", 45], [11.85, "guard", 44],

// def = who is being struck; their position is fine-tuned at load so the blades really meet
const EVENTS = [
  { t: 3.3, type: "clash", def: "B", big: 1, label: "Overhead" },
  { t: 3.95, type: "clash", def: "A", label: "Counter" },
  { t: 4.3, type: "grind" }, { t: 4.6, type: "grind" },
  { t: 4.95, type: "shove", label: "Shove" },
  { t: 5.85, type: "clash", def: "B", big: 1, label: "Spin slash" },
  { t: 6.45, type: "whiff", label: "Dodge" },
  { t: 6.84, type: "impact", label: "Kick" }, { t: 7.2, type: "dustB" },
  { t: 7.95, type: "clash", def: "A", big: 1, label: "Spin cut" },
  { t: 9.0, type: "clash", def: "B", big: 2, label: "Aerial flip" }, { t: 9.25, type: "dustA" },
  { t: 9.85, type: "clash", def: "A", label: "Parry" },
  { t: 10.35, type: "clash", def: "A", label: "Chop" },

function drawShadows() {

/* ---------- knights ---------- */

function buildKnight(k, st) {

    cap(ma(vs, k.S, -5.5), ma(vs, k.S, 5.5), 1, .02, { noEdge: true, noShadow: true, bias: 3 });
    cap(ma(ma(k.head, k.hu, 11.5), k.hn, -5), ma(ma(k.head, k.hu, 12.5), k.hn, 3), 1.9, .7, { bias: .5 });
  } else {
    cap(k.neck, ma(k.head, k.hu, -3), 7, .38);
    ball(ma(ma(k.head, k.hu, 1), k.hn, -1), 8.4, A * 1.2);
    cap(ma(k.head, k.hn, 3), ma(ma(k.head, k.hn, 12.5), k.hu, -1.5), 3.4, .9, { bias: .5 });
    const vs = ma(ma(k.head, k.hn, 8.5), k.hu, 1);
    cap(ma(vs, k.S, -3), ma(vs, k.S, 3), .8, .04, { noEdge: true, noShadow: true, bias: 3 });

    cap(sh, el, 4.1, A);
    cap(el, hd, 3.7, A);

/* ---------- cape (3D verlet) ---------- */
const cape = { pts: null, prev: null };

}
function stepCape(k, dt, t) {

  const pts = cape.pts, prev = cape.prev;
  pts[0] = capeAnchor(k); prev[0] = pts[0].slice();
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i], q = prev[i];
    const v = mul3(sub3(p, q), .965);
    cape.prev[i] = p.slice();
    const acc = [-k.F[0] * 90 + Math.sin(t * 7 + i * .9) * 50, -520 + Math.sin(t * 5 + i) * 40, -k.F[2] * 90 + Math.cos(t * 6 + i) * 40];
    pts[i] = add3(add3(p, v), mul3(acc, dt * dt));

      const p = pts[i], c = segClosest(k.hip, k.neck, p, p), gap = sub3(p, c.c1), gl = len3(gap);
      if (gl < 10.5) pts[i] = ma(c.c1, gl > .01 ? norm3(gap) : mul3(k.Nt, -1), 10.5);

    }
  }
}
function buildCape(k, st) {
  const pts = cape.pts; if (!pts) return;
  for (let i = 0; i < pts.length - 1; i++) {
    const w0 = 6 + i * 1.1, w1 = 7.1 + i * 1.1, a = pts[i], b = pts[i + 1];
    const nrm = norm3(cross3(sub3(b, a), k.S));

    shadows.push([lerp3(a, b, .5), lerp3(a, b, .5), w0 * .7]);
  }
}

/* ---------- world ---------- */
seed = 42;
const PILLARS = Array.from({ length: 12 }, (_, i) => {
  const a = i / 12 * TAU + .13;
  return { x: Math.cos(a) * 330, z: Math.sin(a) * 330, h: 110 + rnd() * 110 };
});
const STONES = Array.from({ length: 140 }, () => {
  const a = rnd() * TAU, r = Math.sqrt(rnd()) * 200;
  return { x: Math.cos(a) * r, z: Math.sin(a) * r, s: .8 + rnd() * 2.4, v: .18 + rnd() * .25 };
});

function drawGround(center) {
  // spotlight pool
  for (let ring = 0; ring < 6; ring++) {
    const R = 150 - ring * 24;
    cx.beginPath();
    let ok = true;
    for (let i = 0; i <= 40; i++) {
      const a = i / 40 * TAU, p = proj([center[0] + Math.cos(a) * R, 0, center[2] + Math.sin(a) * R]);
      if (!p) { ok = false; break; }
      i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]);
    }
    if (!ok) continue;
    cx.fillStyle = "rgba(255,255,255," + (.075 * (1 - cam.f[1] * -.9)).toFixed(3) + ")"; cx.fill();
  }
  // floor grid
  cx.lineWidth = 1;
  for (let g = -240; g <= 240; g += 24) {
    for (const along of [0, 1]) {
      let prev = null;
      for (let s = -240; s <= 240; s += 24) {
        const wp = along ? [g, 0, s] : [s, 0, g];
        const p = proj(wp);
        if (p && prev) {
          const r = Math.hypot(wp[0], wp[2]);
          cx.strokeStyle = W_(clamp(.2 - r / 1400, 0, .2));
          cx.beginPath(); cx.moveTo(prev[0], prev[1]); cx.lineTo(p[0], p[1]); cx.stroke();
        }
        prev = p;
      }
    }
  }
  for (const s of STONES) {
    const p = proj([s.x, 0, s.z]);
    if (!p) continue;
    cx.beginPath(); cx.ellipse(p[0], p[1], s.s * p[3], s.s * p[3] * .45, 0, 0, TAU); cx.fillStyle = W_(s.v * fog(p[2])); cx.fill();
  }
}
function buildPillars(targetDepth) {
  for (const pl of PILLARS) {
    const pb = proj([pl.x, 0, pl.z]);
    if (!pb || pb[2] < targetDepth - 40) continue;          // never let a pillar block the fight
    cap([pl.x, 0, pl.z], [pl.x, pl.h, pl.z], 8, .36, { noShadow: true, noEdge: true });
    ball([pl.x, pl.h, pl.z], 9, .34, { noShadow: true });
  }
}

/* ---------- particles (3D) ---------- */
let parts = [];
const ash = [];
function spawnSparks(p, n, power) {
  for (let i = 0; i < n; i++) {
    const v = norm3([(Math.random() - .5) * 2, Math.random() * 1.4 - .2, (Math.random() - .5) * 2]), s = (90 + Math.random() * 320) * power;
    const life = .25 + Math.random() * .5;
    parts.push({ k: "spark", p: p.slice(), v: mul3(v, s), life, max: life });
  }
  for (let i = 0; i < n / 3; i++) {
    const life = .6 + Math.random() * .8;
    parts.push({ k: "ember", p: p.slice(), v: [(Math.random() - .5) * 90, Math.random() * 120, (Math.random() - .5) * 90], life, max: life });
  }
}
function spawnImpact(p, big) {
  parts.push({ k: "ring", p: p.slice(), r: 3, grow: 150 + big * 90, life: .32, max: .32 });
  parts.push({ k: "burst", p: p.slice(), n: 10 + big * 6, len: 26 + big * 16, rot: Math.random() * TAU, life: .16 + big * .04, max: .16 + big * .04 });
}
function spawnDust(x, z, n) {
  for (let i = 0; i < n; i++) {
    const life = .6 + Math.random() * .7;
    parts.push({ k: "dust", p: [x + (Math.random() - .5) * 16, 2, z + (Math.random() - .5) * 16], v: [(Math.random() - .5) * 110, Math.random() * 35, (Math.random() - .5) * 110], life, max: life, r: 3 + Math.random() * 4 });
  }
}
function stepParts(dt) {
  for (const q of parts) {
    q.life -= dt;
    if (q.k === "ring") { q.r += q.grow * dt; continue; }
    if (q.k === "burst") continue;
    if (q.k === "spark") { q.v[1] -= 420 * dt; q.v = mul3(q.v, .985); }
    else if (q.k === "ember") q.v[1] -= 60 * dt;
    else { q.v = mul3(q.v, .94); q.r += 14 * dt; }
    q.p = ma(q.p, q.v, dt);
    if (q.p[1] < 0 && q.k !== "dust") { q.p[1] = 0; q.v[1] *= -.3; }
  }

}
function drawParts() {
  cx.lineCap = "round";
  for (const q of parts) {
    const a = q.life / q.max, pp = proj(q.p);
    if (!pp) continue;
    if (q.k === "spark") {
      const pt = proj(ma(q.p, q.v, -.022));
      if (!pt) continue;
      cx.strokeStyle = W_(a); cx.lineWidth = Math.max(1, 1.2 * pp[3]);
      cx.beginPath(); cx.moveTo(pp[0], pp[1]); cx.lineTo(pt[0], pt[1]); cx.stroke();
    } else if (q.k === "ember") {
      cx.beginPath(); cx.arc(pp[0], pp[1], Math.max(.7, .9 * pp[3]), 0, TAU); cx.fillStyle = W_(a * .9); cx.fill();
    } else if (q.k === "dust") {
      cx.beginPath(); cx.arc(pp[0], pp[1], q.r * pp[3], 0, TAU); cx.fillStyle = W_(a * .16); cx.fill();
    } else if (q.k === "ring") {
      cx.strokeStyle = W_(a * .9); cx.lineWidth = Math.max(1, 2.4 * pp[3] * a);
      cx.beginPath(); cx.arc(pp[0], pp[1], q.r * pp[3], 0, TAU); cx.stroke();
    } else if (q.k === "burst") {

}
function stepAsh(dt, center) {
  if (!ash.length) for (let i = 0; i < 90; i++) ash.push({ p: [center[0] + (Math.random() - .5) * 360, Math.random() * 160, (Math.random() - .5) * 360], s: .6 + Math.random(), ph: Math.random() * 6 });

/* sword trails */
function drawTrail(track, side, t) {
  const N = 6, dt = .012, tips = [], mids = [];
  for (let i = 0; i <= N; i++) {
    const tt = Math.max(0, t - i * dt), r = rig(poseAt(track, tt), side, tt);
    if (r.noSword) return;
    const a = proj(r.tip), b = proj(ma(r.guardPt, r.sd, 28));

  }
  const speed = dist3(tips[0][0], tips[N][0]) / (N * dt);
  if (speed < 260) return;
  const alpha = clamp((speed - 260) / 1600, 0, .28);
  for (let i = 0; i < N; i++) {
    cx.beginPath();
    cx.moveTo(tips[i][1][0], tips[i][1][1]); cx.lineTo(tips[i + 1][1][0], tips[i + 1][1][1]);
    cx.lineTo(mids[i + 1][0], mids[i + 1][1]); cx.lineTo(mids[i][0], mids[i][1]); cx.closePath();

/* ================================================================
   events + time
   ================================================================ */
let T = 0, lastShot = -1;
const moveEl = $("move");
function showMove(label) {
  $("moveName").textContent = label.toUpperCase();
  $("moveBits").textContent = BIN(label);
  moveEl.classList.remove("pop"); void moveEl.offsetWidth; moveEl.classList.add("pop");
}
function fire(e) {
  const { a, b } = rigsAt(e.t);
  if (e.label) showMove(e.label);
  switch (e.type) {
    case "clash": case "grind": {
      const hit = segClosest(a.guardPt, a.tip, b.guardPt, b.tip);
      if (e.type === "grind") { spawnSparks(hit.mid, 8, .5); break; }
      const big = e.big || 0;
      spawnSparks(hit.mid, 26 + big * 18, 1 + big * .25);
      spawnImpact(hit.mid, big);
      flash = Math.max(flash, .45 + big * .25); shake = Math.max(shake, 2 + big * 2);
      punch = .08 + big * .05; hitStop = .07 + big * .04;
      break;
    }
    case "impact": spawnDust(b.hip[0], b.hip[2], 10); spawnImpact(a.footN, 0); shake = 3.5; flash = .25; punch = .08; hitStop = .08; break;
    case "shove": spawnDust(a.footF[0], a.footF[2], 10); shake = 2.5; punch = .05; hitStop = .05; break;
    case "dustA": spawnDust(a.footN[0], a.footN[2], 14); spawnDust(a.footF[0], a.footF[2], 8); shake = 3; break;
    case "dustB": spawnDust(b.footF[0], b.footF[2], 12); break;
    case "disarm": spawnSparks(b.guardPt, 34, 1.2); spawnImpact(b.guardPt, 2); flash = .8; shake = 4; punch = .12; hitStop = .12; break;
    case "land": { const f = FLY.at(e.t); spawnDust(f.pos[0], f.pos[2], 16); spawnSparks([f.pos[0], 2, f.pos[2]], 10, .5); break; }
  }
}
function fireBetween(t0, t1) { for (const e of EVENTS) if (e.t > t0 && e.t <= t1) fire(e); }
function seek(t) {
  T = clamp(t, 0, END - .001);
  parts = []; cape.pts = null; flash = 0; shake = 0; punch = 0; hitStop = 0; lastShot = -1;
}

/* ================================================================
   compose a duel frame
   ================================================================ */
const caption = $("caption");
let captionText = "";

function drawDuel(sdt) {
  const shot = shotAt(T);
  if (shot.i !== lastShot) { if (lastShot !== -1) glitch = .13; lastShot = shot.i; }
  const mx = midX(T);
  const jit = [(Math.random() - .5) * shake, (Math.random() - .5) * shake, (Math.random() - .5) * shake];
  const target = add3([mx + shot.dx, shot.ty, 0], jit);
  cam = makeCamera(target, shot.az, shot.pitch, shot.dist * (1 - punch), shot.roll);
  const targetDepth = dot3(sub3([mx, 60, 0], cam.pos), cam.f);

  const rs = rigsAt(T);
  stepCape(rs.a, sdt, T);
  stepParts(sdt);
  stepAsh(sdt, [mx, 0, 0]);

  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#000"; cx.fillRect(0, 0, SW, SH);

  // faint backlight behind the arena
  const bl = proj([mx, 110, -140]);
  if (bl) {
    const R = 230 * bl[3], g = cx.createRadialGradient(bl[0], bl[1], 0, bl[0], bl[1], R);
    g.addColorStop(0, "rgba(255,255,255,.14)"); g.addColorStop(1, "rgba(255,255,255,0)");
    cx.fillStyle = g; cx.fillRect(bl[0] - R, bl[1] - R, R * 2, R * 2);
  }

  prims = []; shadows = [];
  buildPillars(targetDepth);
  buildCape(rs.a, STYLE.A);
  buildKnight(rs.b, STYLE.B);
  buildKnight(rs.a, STYLE.A);
  const fly = FLY.at(T);
  if (fly) buildSword(fly.pos, fly.sd, [0, 0, 1], 1);

  drawGround([mx, 0, 0]);
  drawShadows();
  drawTrail(TR.B, -1, T);
  drawTrail(TR.A, 1, T);
  drawPrims();
  drawParts();
  drawAsh();

  // screen-space overlays
  cx.setTransform(1, 0, 0, 1, 0, 0);
  const vg = cx.createRadialGradient(SW / 2, SH / 2, Math.min(SW, SH) * .35, SW / 2, SH / 2, Math.max(SW, SH) * .72);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.7)");
  cx.fillStyle = vg; cx.fillRect(0, 0, SW, SH);

  const intro = clamp((T - .15) / .35, 0, 1) * clamp((1.6 - T) / .4, 0, 1);
  const outro = clamp((T - 16.8) / .5, 0, 1) * clamp((END - .5 - T) / .6, 0, 1);
  const titleA = Math.max(intro, outro);
  if (titleA > 0) {
    const text = "BINARY DUEL";
    let fs = Math.round(SH * .2);
    cx.font = "900 " + fs + "px 'Arial Black', 'Segoe UI Black', Arial, sans-serif";
    let widths = [...text].map(ch => cx.measureText(ch).width), gap = fs * .16;
    let total = widths.reduce((q, w) => q + w + gap, -gap);
    if (total > SW * .9) {
      const k = SW * .9 / total;
      fs = Math.floor(fs * k); gap *= k; widths = widths.map(w => w * k); total *= k;
      cx.font = "900 " + fs + "px 'Arial Black', 'Segoe UI Black', Arial, sans-serif";
    }
    cx.textAlign = "left"; cx.textBaseline = "middle";
    cx.fillStyle = "rgba(255,255,255," + titleA + ")";
    const ty = intro > 0 ? SH * .4 : SH * .2;
    let tx = (SW - total) / 2;
    [...text].forEach((ch, i) => { cx.fillText(ch, tx, ty); tx += widths[i] + gap; });
  }
  const want = intro > 0 ? BIN("DUEL") : outro > 0 ? BIN("VICTORY") : "";
  if (want && want !== captionText) { captionText = want; caption.textContent = want; }
  caption.style.top = intro > 0 ? "56%" : "34%";
  caption.style.opacity = titleA.toFixed(2);

  if (flash > .01) { cx.fillStyle = "rgba(255,255,255," + (flash * .55).toFixed(3) + ")"; cx.fillRect(0, 0, SW, SH); }
  fade = clamp(T / .5, 0, 1) * clamp((END - T) / .7, 0, 1);
}

/* ---------- video mode ---------- */
const vid = $("vid");
let clipName = "";
function drawVideo() {
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#000"; cx.fillRect(0, 0, SW, SH);
  if (vid.readyState >= 2 && vid.videoWidth) {
    const s = Math.min(SW / vid.videoWidth, SH / vid.videoHeight);
    const w = vid.videoWidth * s, h = vid.videoHeight * s;
    cx.drawImage(vid, (SW - w) / 2, (SH - h) / 2, w, h);
  }
  fade = 1;
  caption.style.opacity = 0;
}

/* ================================================================
   main loop
   ================================================================ */
const seekFill = document.querySelector("#seek i");
let last = performance.now(), hudAt = 0, fpsN = 0, fpsT = 0, fps = 60;
function frame(now) {
  requestAnimationFrame(frame);
  if (!W || !H) { if (innerWidth && innerHeight) resize(); last = now; return; }
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  let sdt = 0;
  if (state.mode === "duel") {
    if (state.playing) {
      if (hitStop > 0) hitStop -= rdt;                       // freeze-frame on impact
      else {
        sdt = rdt * rateAt(T);
        const t0 = T;
        T += sdt;
        if (T >= END) { fireBetween(t0, END); seek(0); }
        else fireBetween(t0, T);
      }
    }
    drawDuel(sdt);
  } else {
    drawVideo();
  }
  flash = Math.max(0, flash - rdt * 4);
  shake = Math.max(0, shake - rdt * 12);
  punch = Math.max(0, punch - rdt * .6);
  glitch = Math.max(0, glitch - rdt);
  renderDigits(now / 1000);

  fpsN++; fpsT += rdt;
  if (fpsT > .5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  if (now - hudAt > 90) {
    hudAt = now;
    if (state.mode === "duel") {
      const r = rateAt(T);
      $("hShot").textContent = "Shot " + String(shotAt(T).i + 1).padStart(2, "0") + "/" + SHOTS.length;
      $("hTime").textContent = "T " + T.toFixed(2).padStart(5, "0");
      $("hHits").textContent = "Hits " + String(EVENTS.filter(e => e.t <= T && (e.type === "clash" || e.type === "impact" || e.type === "disarm")).length).padStart(2, "0");
      $("hRate").textContent = hitStop > 0 ? "impact" : r < 1 ? "slow ×" + r.toFixed(2) : "";
      seekFill.style.width = (T / END * 100) + "%";
    } else {
      $("hShot").textContent = "Clip · " + clipName;
      $("hTime").textContent = "T " + (vid.currentTime || 0).toFixed(2).padStart(5, "0");
      $("hHits").textContent = ""; $("hRate").textContent = "";
      seekFill.style.width = (vid.duration ? vid.currentTime / vid.duration * 100 : 0) + "%";
    }
    $("hGrid").textContent = cols + " × " + rows + " bits · " + fps + " fps";
  }
}

/* ================================================================
   controls
   ================================================================ */
const bPlay = $("bPlay");
function setPlaying(p) {
  state.playing = p;
  bPlay.textContent = p ? "❚❚" : "▶";
  if (state.mode === "video") { p ? vid.play().catch(() => {}) : vid.pause(); }
  poke();
}
function restart() {
  if (state.mode === "video") vid.currentTime = 0; else seek(0);
  setPlaying(true);
}
function setDensity(v) {
  state.density = clamp(Math.round(v), 5, 22);
  $("rDensity").value = state.density;
  store.set("binaryDuel.cell", state.density);
  resize();
}
function cyclePalette() {
  state.pal = (state.pal + 1) % PALETTES.length;
  $("bPalette").textContent = PALETTES[state.pal].name;
  store.set("binaryDuel.pal", state.pal);
  buildAtlas();
}
function toSource() { document.body.classList.toggle("showsrc"); $("bSource").classList.toggle("on", document.body.classList.contains("showsrc")); }
function toDuel() {
  state.mode = "duel";
  vid.pause();
  $("bDuel").classList.add("on");
  restart();
}
function loadClip(file) {
  if (!file || !/^video\//.test(file.type)) return;
  if (vid.src) URL.revokeObjectURL(vid.src);
  vid.src = URL.createObjectURL(file);
  clipName = file.name.length > 28 ? file.name.slice(0, 25) + "…" : file.name;
  state.mode = "video";
  $("bDuel").classList.remove("on");
  caption.style.opacity = 0;
  vid.play().catch(() => {});
  setPlaying(true);
}

bPlay.onclick = () => setPlaying(!state.playing);
$("bRestart").onclick = restart;
$("rDensity").oninput = e => setDensity(+e.target.value);
$("rGain").oninput = e => { state.gain = +e.target.value; };
$("bPalette").onclick = cyclePalette;
$("bSource").onclick = toSource;
$("bDuel").onclick = toDuel;
$("fVideo").onchange = e => { loadClip(e.target.files[0]); e.target.value = ""; };
$("bFull").onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); };
$("seek").onclick = e => {
  const f = clamp(e.clientX / innerWidth, 0, 1);
  if (state.mode === "video") { if (vid.duration) vid.currentTime = f * vid.duration; }
  else seek(f * END);
};

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); setPlaying(!state.playing); }
  else if (k === "r") restart();
  else if (k === "p") cyclePalette();
  else if (k === "s") toSource();
  else if (k === "f") $("bFull").click();
  else if (k === "l") $("fVideo").click();
  else if (k === "d") toDuel();
  else if (k === "+" || k === "=") setDensity(state.density - 1);
  else if (k === "-" || k === "_") setDensity(state.density + 1);
  else if (k === "arrowleft" || k === "arrowright") {
    const d = k === "arrowleft" ? -1 : 1;
    if (state.mode === "video") vid.currentTime = Math.max(0, vid.currentTime + d);
    else seek((T + d + END) % END);
  }
  poke();
});

let idleTimer = 0;
function poke() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (state.playing) document.body.classList.add("idle"); }, 2600);
}
addEventListener("pointermove", poke);
addEventListener("pointerdown", poke);

addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragging"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("dragging");
  loadClip(e.dataTransfer.files && e.dataTransfer.files[0]);
});

let resizeRaf = 0;
addEventListener("resize", () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(resize); });

// ?t=8.1&pause — jump to a moment (handy for stills)
const qs = new URLSearchParams(location.search);
if (qs.has("t")) seek(parseFloat(qs.get("t")) || 0);
if (qs.has("pause")) state.playing = false;

$("rDensity").value = state.density;
$("bPalette").textContent = PALETTES[state.pal].name;
bPlay.textContent = state.playing ? "❚❚" : "▶";
resize();
poke();
requestAnimationFrame(frame);

window.binaryDuel = {
  seek,
  clashReport: () => EVENTS.filter(e => e.def).map(e => {
    const { a, b } = rigsAt(e.t);
    return { t: e.t, label: e.label, gap: +segClosest(a.guardPt, a.tip, b.guardPt, b.tip).d.toFixed(1) };
  }),
};
})();
</script>
</body>
</html>
